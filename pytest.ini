[pytest]
# Makes sure the repo root (and therefore the api/ and data/ packages) is
# always importable in tests, regardless of how pytest is invoked - `pytest`,
# `python -m pytest`, from CI, from an IDE, etc. Without this, a plain
# `pytest` invocation (which CI uses) fails with "ModuleNotFoundError: No
# module named 'api'" because pytest only adds the tests/ folder itself to
# sys.path, not the project root.
pythonpath = .
